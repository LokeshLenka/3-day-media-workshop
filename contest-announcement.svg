<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Workshop contest announcement</title>
  <desc id="desc">A contest will follow the editing workshop. The winner will receive exciting prize money. Winner to be announced after the contest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5c0719"/><stop offset=".55" stop-color="#890c25"/><stop offset="1" stop-color="#32141c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdfc"/><stop offset="1" stop-color="#f0d9de"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#fff" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1400" height="800" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="800" rx="28" fill="url(#dots)"/>
  <path d="M0 590 Q350 490 700 620 T1400 550 V800 H0Z" fill="#260810" opacity=".48"/>
  <g fill="none" stroke="#d08a99" stroke-width="9" stroke-linecap="round" opacity=".9">
