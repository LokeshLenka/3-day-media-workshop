  <text x="700" y="438" text-anchor="middle" fill="#32141c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Join the contest after the editing workshop</text>
  <text x="700" y="485" text-anchor="middle" fill="#775e66" font-family="Arial, Helvetica, sans-serif" font-size="26">Create with your new skills for a chance to win</text>
